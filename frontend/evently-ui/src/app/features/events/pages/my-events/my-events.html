<div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
  <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-1">My Events</h2>
  <p class="text-sm sm:text-base text-gray-500 mb-4 sm:mb-6">View and manage your event calendar</p>
  
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 sm:gap-0 mb-6">
    <div class="flex items-center gap-3">
      <button (click)="prev()" class="hover:text-blue-600 transition p-1" aria-label="Previous">
        <span class="material-icons text-xl">chevron_left</span>
      </button>
      <span class="text-sm sm:text-base text-gray-700 font-medium capitalize select-none min-w-[140px] sm:min-w-40 text-center">
        {{ calendarTitle() }}
      </span>
      <button (click)="next()" class="hover:text-blue-600 transition p-1" aria-label="Next">
        <span class="material-icons text-xl">chevron_right</span>
      </button>
    </div>
    
    <div class="flex bg-gray-100 rounded-full overflow-hidden self-start sm:self-auto">
      <button
        (click)="toggleView('dayGridMonth')"
        class="px-4 sm:px-5 py-2 text-sm font-medium transition"
        [ngClass]="{ 'bg-blue-600 text-white': calendarView() === 'dayGridMonth', 'text-gray-700': calendarView() !== 'dayGridMonth' }"
      >
        Month
      </button>
      <button
        (click)="toggleView('dayGridWeek')"
        class="px-4 sm:px-5 py-2 text-sm font-medium transition"
        [ngClass]="{ 'bg-blue-600 text-white': calendarView() === 'dayGridWeek', 'text-gray-700': calendarView() !== 'dayGridWeek' }"
      >
        Week
      </button>
    </div>
  </div>
  
  <div class="transition-all duration-300 min-h-[500px] sm:min-h-[700px]">
    <full-calendar [options]="calendarOptions()"></full-calendar>
  </div>
  
  @if (events().length === 0) {
    <p class="text-center text-gray-500 mt-10 text-sm sm:text-base px-4">
      You are not part of any events yet. <br />
      <a routerLink="/events" class="text-blue-600 hover:underline">
        Explore public events
      </a>
      and join.
    </p>
  }
</div>
