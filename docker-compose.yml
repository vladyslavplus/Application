services:
  evently-db:
    image: postgres:16
    container_name: evently-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - evently_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - evently-net

  evently-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evently-api
    ports:
      - "5000:8080"
    env_file:
      - ./.env
    depends_on:
      evently-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - evently-net

volumes:
  evently_data:

networks:
  evently-net:
    driver: bridge